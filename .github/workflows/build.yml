# Build christopherabraham.com from src/ and commit the generated pages.
#
# The site is a static site: tools/build.py turns the page sources in src/
# into the finished HTML (plus the sitemap, feeds, llms.txt, and the other
# generated files), then checks the house rules. This workflow runs that
# build on every push that touches the sources and commits the result, so a
# new page goes live without a local Python run. Pushes made with the
# default GITHUB_TOKEN do not trigger new workflow runs, so this cannot loop.
name: Build and publish the site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare the October 23 publish
        run: |
          python3 - <<'EOF'
          import io

          def patch(path, old, new, why):
              s = io.open(path, encoding="utf-8").read()
              if new in s:
                  print(path + ": already patched (" + why + ")")
                  return
              assert old in s, (path, "neither old nor new text found")
              assert s.count(old) == 1, (path, "anchor is not unique")
              io.open(path, "w", encoding="utf-8").write(s.replace(old, new))
              print(path + ": patched (" + why + ")")

          # 1. Register the new pages in tools/build.py, following the
          # existing convention for added pages.
          p = "tools/build.py"
          s = io.open(p, encoding="utf-8").read()
          if "services/ai-visibility" not in s:
              anchor = 'SERVICE_GROUPS[0][1].append("services/inquiry-path-audit/")'
              assert s.count(anchor) == 1, "FILES anchor not found"
              add = (anchor
                     + "\n# Additional service and article, October 23, 2026."
                     + '\nFILES += ["services/ai-visibility", "the-machine-answers-first"]'
                     + '\nSERVICE_GROUPS[1][1].append("services/ai-visibility/")')
              io.open(p, "w", encoding="utf-8").write(s.replace(anchor, add))
              print("tools/build.py: new pages registered")
          else:
              print("tools/build.py: pages already registered")

          # 2. House rule: link text must say something on its own, so no
          # bare URLs as link text. Use the site's {calendly} placeholder
          # with descriptive text, as src/hire-me.html does.
          patch("src/services/ai-visibility.html",
                '<a href="https://calendly.com/chrisabraham/30">https://calendly.com/chrisabraham/30</a>',
                '<a href="{calendly}">book a 30 minute call</a>',
                "calendly link text")
          patch("src/services/ai-visibility.html",
                '<a class="button" href="https://calendly.com/chrisabraham/30">Book the call: https://calendly.com/chrisabraham/30</a>',
                '<a class="button" href="{calendly}">Book a 30 minute call</a>',
                "calendly button text")
          patch("src/the-machine-answers-first.html",
                ': <a href="https://calendly.com/chrisabraham/30">https://calendly.com/chrisabraham/30</a></p>',
                ': <a href="{calendly}">book a 30 minute call</a>.</p>',
                "calendly link text")

          # 3. Island rule: the name "Hill Mole" may not appear anywhere.
          # Reword the two existing mentions (services index, about) to comply.
          patch("src/services/index.html",
                "That is how I moved Hill Mole, my own novel's site, off legacy hosting and onto GitHub Pages.",
                "That is how I moved my own novel's site off legacy hosting and onto GitHub Pages.",
                "island rule")
          patch("src/about.html",
                "Hill Mole",
                "my novel",
                "island rule")

          # 4. List the new service visibly on the services index (the
          # visible list is hand-maintained in the source) and refresh
          # the page's updated date.
          patch("src/services/index.html",
                '<li><a href="{root}services/ai-search/">AI SEO, GEO, and AEO</a>: how ChatGPT, Perplexity, Gemini, Claude, Copilot, and AI Overviews describe you, and how to improve it.</li>',
                '<li><a href="{root}services/ai-search/">AI SEO, GEO, and AEO</a>: how ChatGPT, Perplexity, Gemini, Claude, Copilot, and AI Overviews describe you, and how to improve it.</li>\n<li><a href="{root}services/ai-visibility/">AI visibility</a>: audits of what the AI answers say about your business, the claim layer that fixes it, and monthly measurement.</li>',
                "list the new service")
          patch("src/services/index.html",
                "updated: 2026-10-20",
                "updated: 2026-10-23",
                "refresh updated date")
          EOF

      - name: Build the site
        run: python3 tools/build.py

      - name: Commit the built site
        run: |
          git config user.name 'chrisabraham'
          git config user.email 'cja@well.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Build produced no changes.'
          else
            git commit -m 'Rebuild the site with tools/build.py [skip ci]'
            git push
          fi
