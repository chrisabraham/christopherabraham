# Build christopherabraham.com from src/ and commit the generated pages.
#
# The site is a static site: tools/build.py turns the page sources in src/
# into the finished HTML (plus the sitemap, feeds, llms.txt, and the other
# generated files), then checks the house rules. This workflow runs that
# build on every push that touches the sources and commits the result, so a
# new page goes live without a local Python run. Pushes made with the
# default GITHUB_TOKEN do not trigger new workflow runs, so this cannot loop.
name: Build and publish the site

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check out the sibling site for the borrowed-phrasing check
        uses: actions/checkout@v4
        with:
          repository: chrisabraham/gerriscorp
          path: _sibling/gerris

      - name: Build the site
        env:
          SIBLING_DIR: ${{ github.workspace }}/_sibling/gerris
        run: python3 tools/build.py

      - name: Commit the built site
        run: |
          git config user.name 'chrisabraham'
          git config user.email 'cja@well.com'
          rm -rf _sibling
          git add -A
          if git diff --cached --quiet; then
            echo 'Build produced no changes.'
          else
            git commit -m 'Rebuild the site with tools/build.py [skip ci]'
            git push
          fi
